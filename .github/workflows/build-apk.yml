name: Build Offline Android APK

on:
  push:
    branches: [main, master]
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build-apk:
    name: Build Android APK
    runs-on: ubuntu-latest

    steps:
      - name: Checkout Code
        uses: actions/checkout@v4

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22

      - name: Install Node Dependencies
        run: npm install --legacy-peer-deps

      - name: Build Vite Web Application
        run: npm run build

      - name: Set up Java JDK 21
        uses: actions/setup-java@v4
        with:
          distribution: 'temurin'
          java-version: '21'

      - name: Setup Android SDK Environment & Licenses
        run: |
          echo "ANDROID_HOME=/usr/local/lib/android/sdk" >> $GITHUB_ENV
          echo "ANDROID_SDK_ROOT=/usr/local/lib/android/sdk" >> $GITHUB_ENV
          SDKMANAGER_BIN=$(find /usr/local/lib/android/sdk/cmdline-tools -name sdkmanager -type f | head -n 1)
          echo "Found sdkmanager at: $SDKMANAGER_BIN"
          if [ -n "$SDKMANAGER_BIN" ]; then
            echo "$(dirname "$SDKMANAGER_BIN"):/usr/local/lib/android/sdk/platform-tools" >> $GITHUB_PATH
            mkdir -p ~/.android
            touch ~/.android/repositories.cfg
            yes | "$SDKMANAGER_BIN" --licenses || true
          fi

      - name: Initialize & Sync Capacitor Android
        run: |
          if [ ! -d "android" ]; then
            npx cap add android
          fi
          echo "sdk.dir=/usr/local/lib/android/sdk" > android/local.properties
          npx cap sync android

      - name: Grant Execute Permission for Gradlew
        run: chmod +x android/gradlew

      - name: Build Android Debug APK
        run: |
          cd android
          ./gradlew assembleDebug --no-daemon --stacktrace -Dorg.gradle.jvmargs="-Xmx2048m -XX:MaxMetaspaceSize=512m"

      - name: Verify and Package APK
        run: |
          ls -la android/app/build/outputs/apk/debug/
          test -f android/app/build/outputs/apk/debug/app-debug.apk
          cp android/app/build/outputs/apk/debug/app-debug.apk android/app/build/outputs/apk/debug/Cmaster-v1.0.0.apk

      - name: Upload APK Artifact
        uses: actions/upload-artifact@v4
        with:
          name: Cmaster-Offline-APK
          path: android/app/build/outputs/apk/debug/Cmaster-v1.0.0.apk
          retention-days: 30

      - name: Publish GitHub Release
        uses: softprops/action-gh-release@v2
        if: github.ref == 'refs/heads/main'
        with:
          tag_name: v1.0.0
          name: "Cmaster Offline C IDE v1.0.0 (Android APK)"
          body: |
            ## Cmaster IDE v1.0.0 for Android 🚀
            
            Offline Mobile C Programming IDE.
            
            ### What's Included:
            - **100% Offline C Execution Engine**: Run complex C code, pointers, data structures, and deep recursion (Tower of Hanoi, QuickSort, N-Queens, Binary Search Trees) directly on device without internet or remote servers.
            - **Full Device File Access**:
              - **Save** (`Ctrl+S`): Writes directly to the open file in device internal storage.
              - **Save As** (`Ctrl+Shift+S`): Prompts to save the entire source code as a new `.c` file anywhere on device.
              - **Open**: Directly opens existing `.c`/`.h` files from device storage.
            - **Intelligent Autocomplete & Mobile Symbol Toolbar**: Fast typing with C keywords, stdlib functions, code snippets, and quick symbol insertion.
            - **Interactive Console & Stdin**: Real-time terminal with live user input bar and 60-second runtime limit with recursion stack overflow detection.
            
            ### Download:
            Download **Cmaster-v1.0.0.apk** below and tap to install on your Android device.
          draft: false
          prerelease: false
          files: |
            android/app/build/outputs/apk/debug/Cmaster-v1.0.0.apk
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
