name: Build Offline Android APK

on:
  push:
    branches: [main, master]
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build-apk:
    name: Build Android APK
    runs-on: ubuntu-latest

    steps:
      - name: Checkout Code
        uses: actions/checkout@v4
        with:
          lfs: true
          token: ${{ secrets.GITHUB_TOKEN }}
          fetch-depth: 0

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22

      - name: Install Node Dependencies
        run: npm install --legacy-peer-deps

      - name: Build Vite Web Application
        run: npm run build

      - name: Set up Java JDK 21
        uses: actions/setup-java@v4
        with:
          distribution: 'temurin'
          java-version: '21'

      - name: Setup Android SDK Environment & Licenses
        run: |
          echo "ANDROID_HOME=/usr/local/lib/android/sdk" >> $GITHUB_ENV
          echo "ANDROID_SDK_ROOT=/usr/local/lib/android/sdk" >> $GITHUB_ENV
          SDKMANAGER_BIN=$(find /usr/local/lib/android/sdk/cmdline-tools -name sdkmanager -type f | head -n 1)
          echo "Found sdkmanager at: $SDKMANAGER_BIN"
          if [ -n "$SDKMANAGER_BIN" ]; then
            echo "$(dirname "$SDKMANAGER_BIN"):/usr/local/lib/android/sdk/platform-tools" >> $GITHUB_PATH
            mkdir -p ~/.android
            touch ~/.android/repositories.cfg
            yes | "$SDKMANAGER_BIN" --licenses || true
          fi

      - name: Initialize & Sync Capacitor Android
        run: |
          if [ ! -d "android" ]; then
            npx cap add android
          fi
          echo "sdk.dir=/usr/local/lib/android/sdk" > android/local.properties
          
          # Inject custom Cmaster icons and branding
          if [ -d "android_res" ]; then
            cp -rf android_res/* android/app/src/main/res/
          fi
          
          npx cap sync android

          # Generate complete offline C bundle and runtime datasets (70-90MB standalone payload)
          if [ -f "scripts/generate_offline_c_bundle.py" ]; then
            python3 scripts/generate_offline_c_bundle.py
          fi

      - name: Ensure Valid Gradle Wrapper
        run: |
          chmod +x android/gradlew
          JAR_PATH="android/gradle/wrapper/gradle-wrapper.jar"
          if [ ! -f "$JAR_PATH" ] || [ $(wc -c < "$JAR_PATH") -lt 10000 ]; then
            echo "Gradle wrapper jar is missing or too small, pulling via git lfs or regenerating..."
            git lfs pull --include="$JAR_PATH" || true
          fi
          if [ ! -f "$JAR_PATH" ] || [ $(wc -c < "$JAR_PATH") -lt 10000 ]; then
            echo "Regenerating wrapper with gradle..."
            gradle wrapper --project-dir android || true
          fi
          ls -la android/gradle/wrapper/

      - name: Commit Native Android Project to Repository
        run: |
          git config --global user.name "github-actions[bot]"
          git config --global user.email "github-actions[bot]@users.noreply.github.com"
          git add android/
          if ! git diff --cached --quiet; then
            git commit -m "chore: persist native Android project with custom Cmaster icons"
            git push origin ${{ github.ref_name }}
          fi

      - name: Build Android Debug APK
        run: |
          cd android
          ./gradlew assembleDebug --no-daemon --stacktrace -Dorg.gradle.jvmargs="-Xmx2048m -XX:MaxMetaspaceSize=512m"

      - name: Verify and Package APK
        run: |
          ls -la android/app/build/outputs/apk/debug/
          test -f android/app/build/outputs/apk/debug/app-debug.apk
          cp android/app/build/outputs/apk/debug/app-debug.apk android/app/build/outputs/apk/debug/Cmaster-Mark-2.apk
          cp android/app/build/outputs/apk/debug/app-debug.apk android/app/build/outputs/apk/debug/Cmaster.apk

      - name: Upload APK Artifact
        uses: actions/upload-artifact@v4
        with:
          name: Cmaster-Mark-2-APK
          path: android/app/build/outputs/apk/debug/Cmaster-Mark-2.apk
          retention-days: 30

      - name: Publish GitHub Release
        uses: softprops/action-gh-release@v2
        if: github.ref == 'refs/heads/main'
        with:
          tag_name: v2.0.0
          name: "Cmaster Offline C IDE Mark 2 (Android APK)"
          body: |
            ## Cmaster IDE Mark 2 (v2.0.0) for Android 🚀
            
            The Complete Offline Mobile C Programming IDE — Mark 2.
            
            ### What's New in Mark 2:
            - **Real-Time Interactive Terminal I/O**: Direct in-terminal input for `scanf`, `getchar`, and `gets`! Programs prompt interactively and continue execution upon pressing Enter.
            - **Universal Generator-Based Execution Engine**: Zero dependency on SharedArrayBuffer or cross-origin headers — works on 100% of Android devices and WebViews.
            - **Complex Recursion & Data Structures**: Tower of Hanoi, QuickSort with pointer arithmetic, N-Queens backtracking, Binary Search Trees, and dynamic memory.
            - **Intelligent C Autocomplete**: CodeMirror 6 with C keywords, standard library headers, and smart snippet suggestions.
            - **100% Offline Standalone Package**: Self-contained APK (~73 MB) with complete C standard library headers, runtime datasets, and custom branding.
            
            ### Download:
            Download **Cmaster-Mark-2.apk** (or **Cmaster.apk**) below and tap to install on your Android device.
          draft: false
          prerelease: false
          files: |
            android/app/build/outputs/apk/debug/Cmaster-Mark-2.apk
            android/app/build/outputs/apk/debug/Cmaster.apk
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
