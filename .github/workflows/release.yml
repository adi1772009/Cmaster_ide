name: Build & Publish Release APK

on:
  push:
    tags:
      - 'Mark*'
      - 'v*'

jobs:
  build-release:
    name: Build & Release Standalone APK
    runs-on: ubuntu-latest

    steps:
      - name: Checkout Code
        uses: actions/checkout@v4

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: 'temurin'
          java-version: '17'

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '20'

      - name: Build Web Assets
        working-directory: Program_files
        run: |
          npm ci || npm install
          npm run build
          mkdir -p ../CmasterApp/app/src/main/assets/www
          cp -r dist/* ../CmasterApp/app/src/main/assets/www/

      - name: Setup Gradle
        uses: gradle/actions/setup-gradle@v3

      - name: Build Android Release APK
        working-directory: CmasterApp
        run: |
          chmod +x gradlew || gradle wrapper
          ./gradlew assembleRelease --stacktrace

      - name: Copy & Rename APK
        run: |
          cp CmasterApp/app/build/outputs/apk/release/app-release.apk Cmaster-Mark6.2.apk

      - name: Create GitHub Release
        uses: softprops/action-gh-release@v2
        with:
          name: "Cmaster Release ${{ github.ref_name }}"
          body: |
            ## Cmaster IDE - Standalone Offline Android C IDE
            
            ### Features
            - **100% Offline C Compiler:** Native 64-bit TinyCC (ARM64) compiled on-device.
            - **Native Linking:** Full standard C header library resolution (`stdio.h`, `stdlib.h`, `math.h`, etc.) & Bionic CRT linking.
            - **Interactive Mobile Terminal:** Full interactive `stdin` / `scanf` support and simulated terminal sandbox.
            - **Modern Editor:** CodeMirror 6 with syntax highlighting, compiler error highlights, and touch optimizations.
            - **Storage Access Framework (SAF):** Seamless file browsing and saving from secondary storage (SD cards & internal memory).
            
            ### Installation
            Download `Cmaster-Mark6.2.apk` below, install on your Android device (ARM64), and code offline anywhere!
          files: |
            Cmaster-Mark6.2.apk
            CmasterApp/app/build/outputs/apk/release/app-release.apk
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
